repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-isort
        name: ruff check --fix --select I
        entry: uv run ruff check --fix --select I
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]